# Storefront names that are NOT corporate identities. A banner listed here resolves to NO key: the
# operator behind it is unresolvable across states, so it is dropped from the MSO arithmetic and kept
# in the store denominator. Calling one of these "an independent" would assert something we do not
# know; calling it an MSO is the false merge that put 0.59 pp on the national figure.
#
# DELIBERATELY CONSERVATIVE, and the direction of the caution is the point. Round 24's skeptic ran a
# candidate list of eleven; its finding was that SEVEN were "genuinely counted as MSOs". Which seven
# was not recorded, and two of the eleven — `Greenlight` and `Nature's Medicines` — are real
# multi-state operators (Nature's Medicines is an AYR retail banner), so the candidate list was not a
# verdict. Listing a real chain here would DEFLATE the MSO share, which is an error in the direction
# that flatters nothing; omitting a genuinely generic name leaves the old false merge in place, which
# INFLATES it. Only the second error argues for our own thesis, so this list is confined to names
# that are category words on their face — a test a reader can apply without our data — and the
# remaining candidates (`Green Cross`, `Vibe`, `The Green Room`, `Herbal Remedies`) are deliberately
# left OUT until somebody checks whether each is one chain or several.
not_corporate_identities:
  The Dispensary: A category word with an article. Names no particular company.
  Dispensary: A category word, not a name.
  Dispensary Near Me: A search phrase, not a company name.
  Cannabis: A category word, not a name.
  Top Shelf: A grade of flower, not a company name.
