# Retail BANNER → corporate parent, plus the storefront names that are not corporate identities at
# all. The cross-state key `companies` does not have.
#
# WHY THIS FILE EXISTS. `companies` is UNIQUE (canonical_name, state) and `company_stores.canonical_name`
# is a per-state label, so "is this a multi-state operator?" has only ever been answered by asking
# whether the same STRING shows up in three states. Adversarial Round 24 (2026-07-31) measured both
# ways that fails:
#
#   FALSE MERGE — generic storefront words ("The Dispensary", "Top Shelf") appear in three or more
#     states as unrelated businesses and were counted as MSOs. Dropping them moved the national MSO
#     share 9.84% -> 9.25%.
#   FALSE SPLIT — one parent trades under different banners per state, so its stores counted as
#     several independents. Folding the attested parents moved CT +24.0 pp and NV +17.4 pp, and it
#     WIDENS the regime contrast rather than manufacturing it.
#
# A third case needs no entry here and is handled by `operators.normalize_banner`: "Good Day Farm"
# (MO) and "Gooddayfarm" (LA, AR) are one company under two roster spellings, and normalizing folds
# them without anybody asserting an ownership fact.
#
# THIS IS A KEY, NOT A MATCHER. Lookup is EXACT on the normalized banner. `rung/brands.py` searches
# inside a brand string because product brands appear embedded in longer names; an operator banner is
# the whole label, and substring matching there is how "The Dispensary" swallows "The Dispensary of
# Utah". A banner absent from this file is its own operator.
#
# PROVENANCE, and read the grades — they are not decoration:
#   verified — a primary source states the ownership (an SEC filing naming the retail banner).
#   reported — a reputable secondary source, or an in-repo attestation whose own quote I did not
#              re-open this pass. Checkable, but one link further from the filing than it looks.
#   inferred — derived by us. Round 24 named Cresco->Sunnyside specifically as UNATTESTED; it is
#              still unattested, and it is graded accordingly rather than quietly promoted.
#
# `scripts/load_operator_parent.py` loads these as `operated_by` attestations, the same predicate
# `rung_intel/data/brand_ownership.yml` already uses for Zen Leaf. See docs/provenance_design.md.
#
# THIS SET IS SEEDED, NOT EXHAUSTIVE. It covers the multi-state banners that Round 24's own fold
# touched. `scripts/regime_concentration.py` reports how many stores carry an unresolved banner, and
# `tests/test_operators.py` ratchets that nobody adds a banner without a source.

