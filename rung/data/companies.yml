  - Pluto Cannabis Co.
Smyth:                        # MA — Lowell, 683 Rogers St (Dutchie + Weedmaps + Leafly); "Smyth"'s three Dutchie rows are all "Smyth Cannabis Co. - …"
  - Smyth Cannabis Co.
Cloud:                        # MI — 5 shared rooftops (Traverse City, Utica, Kalamazoo, Grand Rapids ×2)
  - Cloud Cannabis Co.
Gazzz:                        # MI — Roseville, 27935 Groesbeck Hwy (Weedmaps + Dutchie)
  - Gazzz Cannabis Co.
HYDE:                         # MI — Detroit, 8052 E 8 Mile Rd (Weedmaps + Dutchie)
  - Hyde Cannabis Co.
Lume:                         # MI — 38 shared rooftops; every "Lume" row is named "Lume Cannabis Co. (…)"
  - Lume Cannabis Co.
PUFF:                         # MI — Sturgis, 651 Wade St shared; the chain's 21 stores are "PUFF <city>"
  - PUFF Cannabis Company
  - Puff TC
