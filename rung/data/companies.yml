# ── Short-key rulings the MA/MI refolds declined (2026-10-15). Each pair is one operator: the two
#    spellings share a rooftop (the same street address under Dutchie / Weedmaps / Leafly), and the
#    short-named company's own rows are named with the long spelling. The SHORT spelling is the
#    canonical here, deliberately: an alias is global, and "Aura" (PR), "Cloud" (AB), "Pluto" (AB)
#    and "Lume" (OK) are other operators in other states — a long→short alias touches only rows
#    spelled the long way, a short→long one would rename those strangers at the next seed.
