# Explicit homepage overrides for the recon spider.
# Keys must match canonical_name in the companies table EXACTLY. A value is one of three things:
#
#   Curaleaf: https://curaleaf.com
#   Ayr Wellness: null
#   RISE:
#     default: https://risecannabis.com
#     BC: null
#
# A state key is a code states.yml knows, or `default`. ⚠ ONTARIO MUST BE QUOTED — `"ON":` — because
# unquoted ON is the YAML boolean True (so are YES/NO/OFF; no other state code is). The loader
# (`recon.load_homepage_overrides`) is strict: a duplicate key, an unknown state, an unquoted ON, an
# empty string or any other shape refuses the whole file, and tests/test_recon.py loads this file,
# so a bad edit fails the gate rather than the nightly healthcheck.
#
# ⚠ THE KEY IS GLOBAL, AND A STRANGER CAN CARRY THE SAME NAME. The exact lookup protects a regional
#    operator only while its spelling differs: "RISE" is also the canonical_name of Rise Cannabis
#    (Victoria, BC) and Rise Cannabis Co. (Saskatchewan); "Ascend" of Ascend Cannabis Co. (CO) and
#    Ascend Dispensary (OR); "Mission" of Mission Cannabis (BC). Each held Green Thumb's / Ascend
#    Wellness's / Mission's homepage, platform jane and a failed Jane walk until 2026-10-05. The
#    per-state `null` is how the file says "not here". Before adding a key, look at EVERY state
#    whose company carries the spelling (the stores it holds say who it is), not only the one you
#    are seeding. The lookup is deliberately not loosened to a folded match for the same reason.
#
# ⚠ AND A COMPANY'S NAME CAN MOVE UNDER ITS KEY. The 2026-07-14 refold renamed "GTI Ohio, LLC" to
#    "GTI Ohio" and so on; the keys kept the old spellings and matched nothing, hidden by the June
#    recon rows until a 2026-10-05 re-run overwrote four of them with `no_url`. The coverage
#    healthcheck's `recon_would_drop_homepage` / `recon_would_change_homepage` forecast what a
#    re-run would erase or re-point, and `homepage_override_dead_key` names a key reaching no
#    company — read them BEFORE running `recon`, because the run erases the evidence they read.

