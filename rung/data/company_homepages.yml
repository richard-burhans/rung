# ── Spellings the fold reaches but the exact key did not (audited 2026-10-05). 28 companies were
#    reached only through `normalize_brand(extract_brand(name))`; each was judged by the stores it
#    holds and the roster rows behind it, and the homepage was probed. Eight are the same operator
#    under another state's spelling and are keyed here. The rest are deliberately NOT keyed:
#      - a DIFFERENT operator sharing the word: BC "HIVE" (Hive Cannabis, a BC chain — not PA's
#        The Hive), CO "ASCEND" / "ASCEND CANNABIS CO." and OR "ASCEND" (not Ascend Wellness,
#        which has no CO or OR stores), SK "Rise Cannabis Co." (riseonhigh.com, not GTI's RISE).
#        ⚠ Those same strangers ALSO carry the exact names "RISE", "Ascend" and "Mission" in BC, SK,
#        CO and OR — which the exact keys did reach, until the per-state scopes above said not to.
#      - MA / NJ / NY "Health For Life": the company holds Mayflower, MPX NJ and Be. listings and
#        healthforlifedispensaries.com covers Maryland and Arizona only — nothing it could serve.
#      - a 0-store DUPLICATE of a company already carrying the operator in that state (FL "GTI",
#        IL "Nature’s Care", MA "I.N.S.A", OH "Trulieve Cannabis Dispensary"): keying it would walk
#        the operator twice and file the same stores under two companies.
#      - served BETTER by the roster's own state-specific website, which an override would replace:
#        NJ "Apothecarium" (apothecariumnj.com) and PA "Apothecarium" (shop.apothecarium.com),
#        CT "TRULIEVE" / "ZEN LEAF", NJ "BLOC", PA "Local Leaf by Penn Health".
#    "CURALEAF" IS keyed although CT derives ct.curaleaf.com from its roster: the curaleaf_api rung
#    gates only on `curaleaf.com` in the host and reads a fixed state-filtered API, so CT is served
#    the same either way and Nevada's six Weedmaps-only stores gain the rung.
