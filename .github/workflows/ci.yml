name: CI

# Lint -> type-check -> tests + coverage floor. Uses a Postgres service
# container (the tests need a real Postgres; conftest.py hands out a
# throwaway schema per test in the rung_test database).
#
# NOT an automatic check as of 2026-07-21. GitHub-hosted Actions minutes are NOT free on a PRIVATE
# repo, and a ~5-minute gate per PR exhausts the quota fast. The AUTHORITATIVE gate is now the LOCAL
# pre-push hook (`scripts/hooks`, enabled with `git config core.hooksPath scripts/hooks`) running
# `scripts/qa_gate.sh` — see CLAUDE.md "Enforcement". This workflow is kept intact so it can be run
# manually ("Run workflow" in the Actions tab) or repointed at a self-hosted runner (free) later; it
# no longer triggers on push or pull_request.

on:
  workflow_dispatch:

# One in-flight run per branch/PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rung
          POSTGRES_PASSWORD: rung
          POSTGRES_DB: rung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rung -d rung"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest.py reads DATABASE_URL_TEST (default points at the same host:port);
      # set it explicitly so the source of truth is visible in the workflow.
      DATABASE_URL_TEST: postgresql://rung:rung@localhost:5432/rung_test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install 3.13

      - name: Sync dependencies
        # Populate .venv so `ty` can resolve the project's third-party imports
        # (curl_cffi, yaml, …) — it discovers .venv in the project root. The `analysis`
        # extra (matplotlib/numpy/pandas/scikit-learn) lets ty type-check the opt-in
        # scientific-stack scripts too, catching arg-type/overload bugs the core env hid.
        run: uv sync --extra analysis

      - name: Create the pytest database
        # The service provisions `rung`; tests run inside `rung_test`
        # (here we create it directly).
        env:
          PGPASSWORD: rung
        run: psql -h localhost -U rung -d rung -c 'CREATE DATABASE rung_test;'

      # These two MUST match scripts/qa_gate.sh's target lists, and `tests/test_gate_targets.py`
      # now asserts it instead of asking a reader to diff two files. `research/` (the librarian
      # toolchain) was deliberately gated in the local gate but never added here — so the
      # authoritative check, the one that actually blocks a PR, was not looking at it. The 2026-07-18
      # round-2 audit then found `rung_intel/` missing from the ruff list in exactly the same way,
      # two lines under the comment warning about it: the whole private overlay was lint-gated only
      # by the local gate, which `--no-verify` bypasses. A comment saying "these MUST match" is not
      # a mechanism; the test is.
      # Ruff is PINNED (mirror of scripts/qa_gate.sh): an unpinned `uv tool run ruff` grabs the
      # newest release, and newer ruffs broaden what they check (0.16 unilaterally applied BLE001,
      # FURB167, EXE001, … — rules never in this repo's extend-select, some contradicting deliberate
      # decisions), making the gate non-reproducible. Bump deliberately in its own PR, not implicitly.
      - name: Lint (ruff)
        run: uv tool run ruff@0.15.0 check rung/ rung_intel/ tests/ scripts/ faces/

      # `tests/` is deliberately absent from the ty list (ruff lints it, ty does not). This is a
      # KNOWN BACKLOG, not an oversight: adding it surfaces 290 real diagnostics (measured 2026-07-18), almost all of them
      # tests passing `None`/partial fakes where a real type is declared. It is recorded here so the
      # asymmetry reads as a decision with a number attached rather than as drift.
      - name: Type-check (ty)
        run: uv tool run ty check rung/ rung_intel/ scripts/ faces/

      # The coverage floor is named HERE, not in pyproject's addopts, so a bare local `pytest` is not
      # instrumented while iterating. tests/test_gate_targets.py asserts this line and qa_gate.sh's both
      # still carry --cov-fail-under, so the floor cannot quietly go missing from one of them.
      - name: Tests + coverage (pytest)
        run: uv run pytest -q -n 8 --dist loadgroup --cov=rung --cov=rung_intel --cov-fail-under=68
