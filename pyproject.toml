[project]
name = "rung"
version = "0.1.0"
description = "A cost-ranked web-scraping framework — run the cheapest access method that works, persist the winner per target, and self-heal, over a Postgres work queue with a plugin seam for per-domain catalogs."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["scraping", "web-scraping", "crawler", "data-extraction", "postgres", "work-queue", "plugin-framework", "distributed"]
authors = [{ name = "Richard Burhans" }]
dependencies = [
    "click>=8.0",
    "curl-cffi>=0.15.0",
    "pdfplumber>=0.11.9",
    # playwright is NOT imported — it supplies the bundled Chromium binary that pydoll
    # drives (`playwright install chromium`); see browser._resolve_chrome_path. Do not prune.
    "playwright>=1.60.0",
    "psycopg[binary]>=3.2",
    "pydoll-python>=2.23.0",
    "pyyaml>=6.0.3",
    "scrapegraphai>=2.1.3",
    "selectolax>=0.3",
    # Legacy .xls (OLE2) reader for roster spreadsheets served in the old Excel format
    # (xlrd 2.x is deliberately .xls-only).
    "xlrd>=2.0",
    # Modern .xlsx reader for roster spreadsheets (xlrd 2.x dropped .xlsx; openpyxl is the standard).
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# The static-parquet data source (`rung.static_source`) — the no-database path.
static = ["duckdb>=1.1"]

[project.scripts]
recon          = "rung.cli:recon_cmd"
fetch-fx       = "rung.cli:fetch_fx_cmd"
bootstrap-dutchie = "rung.cli:bootstrap_dutchie_cmd"
bootstrap-pools = "rung.cli:bootstrap_pools_cmd"
check-dutchie-hash = "rung.cli:check_dutchie_hash_cmd"
seed-companies = "rung.seed_companies:main"
analyze        = "rung.cli:analyze"
search-states  = "rung.cli:search_states"
show-states    = "rung.cli:show_states"
find-lists     = "rung.cli:find_lists"
scrape-states  = "rung.cli:scrape_states"
scrape-company-stores = "rung.cli:scrape_company_stores_cmd"
scrape-menus   = "rung.cli:scrape_menus_cmd"
dedupe-stores  = "rung.cli:dedupe_stores_cmd"
compare-stores = "rung.cli:compare_stores_cmd"
store-lifecycle = "rung.cli:store_lifecycle_cmd"
prune-jobs     = "rung.cli:prune_jobs_cmd"
reap-jobs      = "rung.cli:reap_jobs_cmd"
worker         = "rung.cli:worker_cmd"

[dependency-groups]
# 2026-07-30 and this repo consumes it as committed files under `refs/`, not as an import. See
# `[tool.uv.sources]` for why a wheel dependency was tried and rejected.
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3", "pytest-timeout>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path for test imports.
pythonpath = ["."]
# --strict-markers/--strict-config catch typos in markers/config; coverage runs as a
# ratchet (fail-under just below the current 70.1% measurement of 2026-07-18) so it flags
# regressions without churning on small uncovered branches. The uncovered remainder is the
# scrape runners) that a unit test can't drive without a real target — the pure logic
# and the CLI wiring around it are tested. Raise the floor as more of it gets covered.
#
# 68, not 70: 70 was proposed on 2026-07-14 and refuted by measurement at 69.6%. The floor had
# sat at 60 against an actual 70.1, which is 10 points of slack — ~880 statements could lose
# coverage and stay green. A ratchet that trails the truth by 10 points is not a ratchet.
#
# COVERAGE IS NOT HERE. It lives on the `pytest` line in `scripts/qa_gate.sh` and `.github/workflows/ci.yml`
# — the two places that GATE — so a bare `pytest` while iterating is not instrumented. It stayed in
# `addopts` for a long time because that guaranteed it could never be forgotten; the replacement guarantee
# is `tests/test_gate_targets.py`, which asserts BOTH files still carry `--cov-fail-under=68`. Moving it
# without that test would have been exactly the silent weakening this repo keeps paying for.
#
# The gate also passes `--dist loadgroup`, which IS load-bearing: several tests regenerate a committed
# view into the working tree and restore it, from DIFFERENT files, so `loadfile` would still run them
# concurrently and they would restore each other's intermediate state — a stale view reporting clean.
# They carry @pytest.mark.xdist_group("repo_tree"); loadgroup pins the whole group to one worker.
addopts = "--strict-markers --strict-config --cov=rung --cov-fail-under=65"
# A wedged subprocess (the librarian generators shell out a lot) otherwise hangs the run with no output.
# tests/conftest.py's _STALE_AFTER derives its safety margin from this number — raising it means raising
# that too, or the schema sweep could reclaim a schema whose test is still running.
timeout = 300
markers = [
    "slow: takes more than ~2s — the corpus generators and the doc-drift audit",
    "corpus: needs the full dev tree (gitignored conversions, sibling repos); skipped on a bare checkout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Extend ruff's default rules (E4/E7/E9/F) with the checks the dignified-python
# standard cares about: import-sorting (I), pyupgrade (UP), bugbear (B),
# comprehension cleanups (C4), simplifications (SIM), and ruff's own lints (RUF).
# E501 (line-length) is intentionally NOT enforced: the codebase predates `ruff
# format`, so wrapping it is a separate, deliberate reformat — not this gate's job.
extend-select = ["I", "UP", "B", "C4", "SIM", "RUF"]
# Ambiguous-unicode lints fire on the intentional → / – glyphs in docstrings and
# prose; suppress rather than ASCII-fold deliberate typography.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Keep `as`-aliased members in one grouped `from X import (...)` block (the existing
# house style) rather than exploding each into its own import statement.
combine-as-imports = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
# The opt-in analysis scripts import the scientific stack (matplotlib/numpy/pandas/scikit-learn/…)
# inside `try/except ImportError` guards, marked `# ty: ignore[unresolved-import]` so the type-check
# passes in the core env where that stack is absent. The QA gate installs the `analysis` extra (so ty
# can actually type-check those scripts and catch real arg-type/overload bugs), which makes those same
# ignore comments look "unused" — but they are still required whenever the extra is absent. The rule is
# therefore env-dependent noise here, so silence it; genuine type errors are still error-level.
unused-ignore-comment = "ignore"
